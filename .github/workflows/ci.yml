name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Test
        run: make test
