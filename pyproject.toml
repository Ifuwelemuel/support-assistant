[project]
name = "support-assistant"
version = "0.1.0"
description = "Customer-support ticket classification and RAG assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=3.0.6",
]

[project.scripts]
check-data = "support_assistant.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
