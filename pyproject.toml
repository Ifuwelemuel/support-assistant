[project]
name = "support-assistant"
version = "0.1.0"
description = "Customer-support ticket classification and RAG assistant"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.142.2",
    "pandas>=3.0.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
check-data = "support_assistant.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

#[tool.ruff]
#line-length = 100
#target-version = "py312"

#[tool.ruff.lint]
#select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
